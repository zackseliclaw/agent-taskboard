# Read once at startup; restart the service after editing.
[identity]
# Labels browser comments and edits; this is not authentication.
display_name = Zack

[server]
host = 0.0.0.0
port = 7778

[storage]
# Relative paths are resolved against the project directory.
database = data/taskboard.db

[models]
# Set model identifiers understood by your agent runner.
# Empty values mean no model override; inherit the agent runner's default.
low = openai/gpt-5.6-luna
medium = openai/gpt-5.6-terra
high = openai/gpt-5.6-sol
very_high = openai/gpt-6-astra
